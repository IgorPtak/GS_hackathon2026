# Front door for the scalable HTTP services: owns host ports 8000 (api) and 8001 (ingest) so that
# `docker compose up --scale api=N --scale ingest=M` works. `resolve` re-reads compose DNS, so
# replicas added or removed after startup join the rotation within `valid`.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log off;

    upstream ingest_replicas {
        zone ingest_replicas 64k;
        server ingest:8001 resolve;
        keepalive 64;
    }

    upstream api_replicas {
        zone api_replicas 64k;
        server api:8000 resolve;
        keepalive 32;
    }

    server {
        listen 8001;
        client_max_body_size 10m;

        location / {
            proxy_pass http://ingest_replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://api_replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # SSE (/api/v1/stream) must reach the browser unbuffered and stay open.
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }

    server {
        listen 8080;

        location = /healthz {
            return 200 "ok\n";
        }
    }
}
