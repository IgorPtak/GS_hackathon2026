# Every job uses DNS discovery on the compose service name, so `--scale <service>=N` is picked up
# without editing this file. Ports match each service's command in compose.yaml.
# `mock-gateway` uses a static target so `up{job="mock-gateway"}` drops to 0 (instead of
# disappearing from service discovery) when the container is stopped.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: processor
    dns_sd_configs:
      - names: ["processor"]
        type: A
        port: 9101
        refresh_interval: 5s

  - job_name: outbox-relay
    dns_sd_configs:
      - names: ["outbox-relay"]
        type: A
        port: 9102
        refresh_interval: 5s

  - job_name: delivery
    dns_sd_configs:
      - names: ["delivery"]
        type: A
        port: 9103
        refresh_interval: 5s

  - job_name: runbook-runner
    dns_sd_configs:
      - names: ["runbook-runner"]
        type: A
        port: 9104
        refresh_interval: 5s

  - job_name: ingest
    dns_sd_configs:
      - names: ["ingest"]
        type: A
        port: 8001
        refresh_interval: 5s

  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 5s

  - job_name: mock-gateway
    static_configs:
      - targets: ["mock-gateway:8090"]
