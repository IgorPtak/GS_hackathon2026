# Every job uses DNS discovery on the compose service name, so `--scale <service>=N` is picked up
# without editing this file. Ports match each service's command in compose.yaml.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: processor
    dns_sd_configs:
      - names: ["processor"]
        type: A
        port: 9101
        refresh_interval: 5s

  - job_name: outbox-relay
    dns_sd_configs:
      - names: ["outbox-relay"]
        type: A
        port: 9102
        refresh_interval: 5s

  - job_name: delivery
    dns_sd_configs:
      - names: ["delivery"]
        type: A
        port: 9103
        refresh_interval: 5s

  - job_name: runbook-runner
    dns_sd_configs:
      - names: ["runbook-runner"]
        type: A
        port: 9104
        refresh_interval: 5s

  - job_name: ingest
    dns_sd_configs:
      - names: ["ingest"]
        type: A
        port: 8001
        refresh_interval: 5s

  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 5s
