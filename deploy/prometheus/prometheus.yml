# Scrapes worker metrics ports and the HTTP services' /metrics. Targets may be down until the
# services implement /metrics (A-02, A-04); that is expected at this stage.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: processor
    # DNS discovery so `--scale processor=N` is picked up without editing this file.
    dns_sd_configs:
      - names: ["processor"]
        type: A
        port: 9101

  - job_name: outbox-relay
    static_configs:
      - targets: ["outbox-relay:9102"]

  - job_name: delivery
    static_configs:
      - targets: ["delivery:9103"]

  - job_name: runbook-runner
    static_configs:
      - targets: ["runbook-runner:9104"]

  - job_name: ingest
    static_configs:
      - targets: ["ingest:8001"]

  - job_name: api
    static_configs:
      - targets: ["api:8000"]
