server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve compose service names per request (Docker DNS), not once at start: a container
    # recreated by `docker compose up --scale` gets a new IP, and a cached one answers 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ingest_upstream http://proxy:8001;
    set $api_upstream http://proxy:8000;
    set $gateway_upstream http://mock-gateway:8090;

    # Ingest rule first, mirroring the Vite dev proxy order.
    location /api/v1/ingest/ {
        proxy_pass $ingest_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Streams (SSE) must not be buffered, so buffering is off for the whole API prefix.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Mock gateway admin proxy (demo outage toggles). With a variable upstream the path is passed
    # as is, so the /gateway prefix is stripped here.
    location /gateway/ {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: unknown paths return index.html so client-side tabs survive a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
