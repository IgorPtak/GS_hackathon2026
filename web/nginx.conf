server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ingest rule first, mirroring the Vite dev proxy order.
    location /api/v1/ingest/ {
        proxy_pass http://ingest:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Streams (SSE) must not be buffered, so buffering is off for the whole API prefix.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Mock gateway admin proxy (demo outage toggles).
    location /gateway/ {
        proxy_pass http://mock-gateway:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: unknown paths return index.html so client-side tabs survive a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
