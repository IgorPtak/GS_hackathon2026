          description: Default owning team, informational.
          title: Team
        enabled:
          default: true
          title: Enabled
          type: boolean
        settings:
          additionalProperties: true
          description: 'Plugin-specific. log_tail: path, line_format (json|regex), line_pattern (regex with named groups),
            start_at (end|beginning). webhook: idempotency_key_path (optional).'
          title: Settings
          type: object
      required:
      - id
      - type
      title: SourceConfig
      type: object
    SourceType:
      enum:
      - webhook
      - alertmanager
      - log_tail
      title: SourceType
      type: string
    SseEvent:
      discriminator:
        mapping:
          action_run.updated: '#/components/schemas/ActionRunUpdatedEvent'
          alert.created: '#/components/schemas/AlertCreatedEvent'
          alert.updated: '#/components/schemas/AlertUpdatedEvent'
          approval.decided: '#/components/schemas/ApprovalDecidedEvent'
          approval.requested: '#/components/schemas/ApprovalRequestedEvent'
          audit.appended: '#/components/schemas/AuditAppendedEvent'
          config.changed: '#/components/schemas/ConfigChangedEvent'
          delivery.updated: '#/components/schemas/DeliveryUpdatedEvent'
          fix_proposal.updated: '#/components/schemas/FixProposalEvent'
          notification: '#/components/schemas/NotificationEvent'
          phone.message: '#/components/schemas/PhoneMessageEvent'
          unknown_schema.detected: '#/components/schemas/UnknownSchemaDetectedEvent'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/AlertCreatedEvent'
      - $ref: '#/components/schemas/AlertUpdatedEvent'
      - $ref: '#/components/schemas/NotificationEvent'
      - $ref: '#/components/schemas/DeliveryUpdatedEvent'
      - $ref: '#/components/schemas/PhoneMessageEvent'
      - $ref: '#/components/schemas/ActionRunUpdatedEvent'
      - $ref: '#/components/schemas/ApprovalRequestedEvent'
      - $ref: '#/components/schemas/ApprovalDecidedEvent'
      - $ref: '#/components/schemas/FixProposalEvent'
      - $ref: '#/components/schemas/UnknownSchemaDetectedEvent'
      - $ref: '#/components/schemas/AuditAppendedEvent'
      - $ref: '#/components/schemas/ConfigChangedEvent'
    StepKind:
      enum:
      - text
      - check
      - action
      title: StepKind
      type: string
    StepRunRequest:
      additionalProperties: false
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
      required:
      - actor
      title: StepRunRequest
      type: object
    Team:
      additionalProperties: false
      description: config/teams/<id>.yaml.
      properties:
        id:
          examples:
          - rates-large-rejections
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          title: Id
          type: string
        display_name:
          title: Display Name
          type: string
        on_call:
          description: Recipient ids.
          items:
            examples:
            - rates-large-rejections
            pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
            type: string
          title: On Call
          type: array
      required:
      - id
      - display_name
      title: Team
      type: object
    ThrottlePolicy:
      additionalProperties: false
      properties:
        max_deliveries:
          description: Per recipient, per rule, per period.
          minimum: 1
          title: Max Deliveries
          type: integer
        per:
          examples:
          - 60s
          - 5m
          - 1h
          pattern: ^[0-9]+(ms|s|m|h|d)$
          title: Per
          type: string
      required:
      - max_deliveries
      - per
      title: ThrottlePolicy
      type: object
    UnknownSchemaDetectedEvent:
      additionalProperties: false
      properties:
        at:
          format: date-time
          title: At
          type: string
        type:
          const: unknown_schema.detected
          default: unknown_schema.detected
          title: Type
          type: string
        sample:
          $ref: '#/components/schemas/UnknownSchemaSample'
      required:
      - at
      - sample
      title: UnknownSchemaDetectedEvent
      type: object
    UnknownSchemaSample:
      additionalProperties: false
      description: Table unknown_schema_samples; one row per distinct key shape.
