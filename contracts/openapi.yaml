# GENERATED components; paths are hand-written. See contracts/README.md.
openapi: 3.1.0
info:
  title: Flexible Alerting & Notification Service
  version: 1.0.0
  description: 'Frozen contract. `/api/v1/ingest/*` is served by the `ingest` service (port 8001); everything

    else by the `api` service (port 8000). The web app proxies both under the same origin.

    `components.schemas` is GENERATED from contracts/alerting_contracts by

    `scripts/generate_contracts.py` — edit the Pydantic models, never this section.

    '
servers:
- url: http://localhost:8000
tags:
- name: ingest
- name: alerts
- name: config
- name: rules
- name: schema-profiles
- name: runbooks
- name: approvals
- name: fix-proposals
- name: phone-simulator
- name: stream
- name: ops
paths:
  /api/v1/ingest/{source_id}:
    post:
      tags:
      - ingest
      operationId: ingestEvent
      summary: Accept one event (or an Alertmanager batch) from an HTTP source; returns 202 after XADD.
      parameters:
      - $ref: '#/components/parameters/SourceId'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      - name: X-Sent-At
        in: header
        required: false
        schema:
          type: string
          format: date-time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/ingest/{source_id}/batch:
    post:
      tags:
      - ingest
      operationId: ingestEventBatch
      summary: Accept a JSON array of events (load generator).
      parameters:
      - $ref: '#/components/parameters/SourceId'
      - name: X-Sent-At
        in: header
        required: false
        schema:
          type: string
          format: date-time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAccepted'
  /api/v1/alerts:
    get:
      tags:
      - alerts
      operationId: listAlerts
      parameters:
      - name: team
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/AlertStatus'
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
  /api/v1/alerts/{alert_id}:
    get:
      tags:
      - alerts
      operationId: getAlert
      summary: Alert with audit, deliveries, rendered runbook, action runs, approvals and fix proposals.
      parameters:
      - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/alerts/{alert_id}/acknowledge:
    post:
      tags:
      - alerts
      operationId: acknowledgeAlert
      parameters:
      - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAcknowledgeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alerts/{alert_id}/resolve:
    post:
      tags:
      - alerts
      operationId: resolveAlert
      parameters:
      - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertResolveRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
  /api/v1/alerts/{alert_id}/runbook/steps/{step_index}/run:
    post:
      tags:
      - runbooks
      operationId: runRunbookStep
      summary: Start a manual step; creates an approval request when the step requires approval. 409 when the alert is resolved or the step already has a run that has not failed.
      parameters:
      - $ref: '#/components/parameters/AlertId'
      - name: step_index
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepRunRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/alerts/{alert_id}/fix-proposals:
    post:
      tags:
      - fix-proposals
      operationId: createFixProposal
      parameters:
      - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixProposalCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixProposal'
  /api/v1/alerts/{alert_id}/fix-proposals/draft:
    post:
      tags:
      - fix-proposals
      operationId: draftFixProposal
      summary: Optional LLM draft of a fix proposal; never saved.
      parameters:
      - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixProposalCreate'
        '503':
          $ref: '#/components/responses/LlmUnavailable'
  /api/v1/fix-proposals:
    get:
      tags:
      - fix-proposals
      operationId: listFixProposals
      parameters:
      - name: team
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProposalStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FixProposal'
  /api/v1/fix-proposals/{proposal_id}/decision:
    post:
      tags:
      - fix-proposals
      operationId: decideFixProposal
      summary: Accepting a proposal with proposed_rule saves it as a new rule version.
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixProposalDecisionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixProposal'
  /api/v1/config:
    get:
      tags:
      - config
      operationId: getConfigLists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigLists'
  /api/v1/config/validate:
    post:
      tags:
      - config
      operationId: validateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigValidationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigValidationResult'
  /api/v1/recipients/{recipient_id}/channel-preferences:
    put:
      tags:
      - config
      operationId: updateChannelPreferences
      parameters:
      - name: recipient_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelPreferencesWrite'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
  /api/v1/rules:
    get:
      tags:
      - rules
      operationId: listRules
      parameters:
      - name: team
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleRecord'
  /api/v1/rules/{rule_id}:
    get:
      tags:
      - rules
      operationId: getRule
      parameters:
      - $ref: '#/components/parameters/RuleId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRecord'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - rules
      operationId: saveRule
      summary: Create or replace; publishes config.changed so workers reload without restart.
      parameters:
      - $ref: '#/components/parameters/RuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleWrite'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRecord'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - rules
      operationId: deleteRule
      parameters:
      - $ref: '#/components/parameters/RuleId'
      responses:
        '204':
          description: Deleted
  /api/v1/rules/preview:
    post:
      tags:
      - rules
      operationId: previewRule
      summary: Run a draft rule over the last window of the events stream (no side effects).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePreviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreview'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/schema-profiles:
    get:
      tags:
      - schema-profiles
      operationId: listSchemaProfiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaProfileRecord'
  /api/v1/schema-profiles/{profile_id}:
    put:
      tags:
      - schema-profiles
      operationId: saveSchemaProfile
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaProfileWrite'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaProfileRecord'
  /api/v1/schema-profiles/propose:
    post:
      tags:
      - schema-profiles
      operationId: proposeSchemaProfile
      summary: LLM (falls back to heuristics) drafts a profile for a sample event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaProfileProposeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaProfileProposal'
  /api/v1/schema-profiles/test:
    post:
      tags:
      - schema-profiles
      operationId: testSchemaProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaProfileTestRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaProfileTestResult'
  /api/v1/unknown-schemas:
    get:
      tags:
      - schema-profiles
      operationId: listUnknownSchemas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnknownSchemaSample'
  /api/v1/runbooks:
    get:
      tags:
      - runbooks
      operationId: listRunbooks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunbookSummary'
  /api/v1/runbooks/normalize:
    post:
      tags:
      - runbooks
      operationId: normalizeRunbook
      summary: Normalize without saving (preview in the runbook editor).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunbookNormalizeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runbook'
  /api/v1/runbooks/{runbook_id}:
    get:
      tags:
      - runbooks
      operationId: getRunbook
      parameters:
      - name: runbook_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runbook'
    put:
      tags:
      - runbooks
      operationId: saveRunbook
      summary: Normalize (LLM for text, at save time) and store.
      parameters:
      - name: runbook_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunbookWrite'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runbook'
  /api/v1/approvals:
    get:
      tags:
      - approvals
      operationId: listApprovalRequests
      parameters:
      - name: team
        in: query
        schema:
          type: string
      - name: is_pending
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalRequest'
  /api/v1/approvals/{approval_request_id}/decision:
    post:
      tags:
      - approvals
      operationId: decideApprovalRequest
      parameters:
      - name: approval_request_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/phone-simulator/messages:
    get:
      tags:
      - phone-simulator
      operationId: listPhoneMessages
      parameters:
      - name: recipient_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhoneMessage'
  /api/v1/phone-simulator/replies:
    post:
      tags:
      - phone-simulator
      operationId: replyFromPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneReplyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneReplyResult'
  /api/v1/stream:
    get:
      tags:
      - stream
      operationId: streamEvents
      summary: 'Server-sent events. Each message: `event: <type>`, `data: SseEvent JSON`. Heartbeat comment every 15 s.'
      parameters:
      - name: team
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseEvent'
  /api/v1/events/recent:
    get:
      tags:
      - ops
      operationId: listRecentEvents
      summary: Newest raw events from the events stream (XREVRANGE); used by the 3 h gate and schema onboarding.
      parameters:
      - name: source_id
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventEnvelope'
  /api/v1/metrics/summary:
    get:
      tags:
      - ops
      operationId: getMetricsSummary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSummary'
  /api/v1/channels/health:
    get:
      tags:
      - ops
      operationId: getChannelHealth
      summary: Circuit breaker state and unfinished deliveries per configured channel.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelHealth'
  /api/v1/llm/status:
    get:
      tags:
      - ops
      operationId: getLlmStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmStatus'
  /healthz:
    get:
      tags:
      - ops
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
components:
  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
    AlertId:
      name: alert_id
      in: path
      required: true
      schema:
        type: string
    RuleId:
      name: rule_id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Invalid body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LlmUnavailable:
      description: Local LLM not reachable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ActionConfig:
      additionalProperties: false
      description: config/actions/<id>.yaml. `type` names the plugin; `webhook` actions need no code.
      properties:
        id:
          examples:
          - rates-large-rejections
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          title: Id
          type: string
        type:
          examples:
          - http_get
          - webhook
          - retry_workflow
          - restart_service
          - open_ticket
          - escalate
          title: Type
          type: string
        description:
          default: ''
          title: Description
          type: string
        approval:
          $ref: '#/components/schemas/ApprovalPolicy'
          default: none
        timeout:
          default: 10s
          examples:
          - 60s
          - 5m
          - 1h
          pattern: ^[0-9]+(ms|s|m|h|d)$
          title: Timeout
          type: string
        params:
          additionalProperties:
            $ref: '#/components/schemas/ActionParamSpec'
          title: Params
          type: object
        settings:
          additionalProperties: true
          description: 'webhook: url, method, headers, body_template.'
          title: Settings
          type: object
      required:
      - id
      - type
      title: ActionConfig
      type: object
    ActionParamSpec:
      additionalProperties: false
      properties:
        description:
          default: ''
          title: Description
          type: string
        is_required:
          default: true
          title: Is Required
          type: boolean
      title: ActionParamSpec
      type: object
    ActionRun:
      additionalProperties: false
      description: One execution of a runbook step's action for an alert (table action_runs).
      properties:
        id:
          title: Id
          type: string
        alert_id:
          title: Alert Id
          type: string
        runbook_id:
          examples:
          - rates-large-rejections
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          title: Runbook Id
          type: string
        step_index:
          title: Step Index
          type: integer
        action_id:
          examples:
          - rates-large-rejections
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          title: Action Id
          type: string
        params:
          additionalProperties:
            type: string
          title: Params
          type: object
        status:
          $ref: '#/components/schemas/ActionRunStatus'
        attempt:
          default: 1
          title: Attempt
          type: integer
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Result
        error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Error
        requested_by:
          $ref: '#/components/schemas/Actor'
        created_at:
          format: date-time
          title: Created At
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - alert_id
      - runbook_id
      - step_index
      - action_id
      - params
      - status
      - requested_by
      - created_at
      - updated_at
      title: ActionRun
      type: object
    ActionRunStatus:
      enum:
      - pending_approval
      - approved
      - rejected
      - running
      - succeeded
      - failed
      - skipped
      title: ActionRunStatus
      type: string
    ActionRunUpdatedEvent:
      additionalProperties: false
      properties:
        at:
          format: date-time
          title: At
          type: string
        type:
          const: action_run.updated
          default: action_run.updated
          title: Type
          type: string
        action_run:
          $ref: '#/components/schemas/ActionRun'
      required:
      - at
      - action_run
      title: ActionRunUpdatedEvent
      type: object
    Actor:
      additionalProperties: false
      description: 'Who performed something: a recipient id, ''system:<service>'' or ''llm''.'
      properties:
        id:
          examples:
          - anna
          - system:processor
          - llm
          title: Id
          type: string
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Display Name
      required:
      - id
      title: Actor
      type: object
    Alert:
      additionalProperties: false
      description: Table alerts. One alert per (rule_id, fingerprint) per dedup window, or per group window.
      properties:
        id:
          description: UUID v7.
          title: Id
          type: string
        rule_id:
          examples:
          - rates-large-rejections
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          title: Rule Id
          type: string
        team:
          examples:
          - rates-large-rejections
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          title: Team
          type: string
        schema_profile_id:
          examples:
          - rates-large-rejections
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          title: Schema Profile Id
          type: string
        source_id:
          examples:
          - rates-large-rejections
