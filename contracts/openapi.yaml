          title: Sent At
        payload:
          additionalProperties: true
          title: Payload
          type: object
      required:
      - event_id
      - source_id
      - source_type
      - received_at
      - payload
      title: EventEnvelope
      type: object
    FieldMappingSpec:
      additionalProperties: false
