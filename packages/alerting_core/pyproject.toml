[project]
name = "alerting-core"
version = "0.1.0"
description = "Shared domain library for the alerting service"
requires-python = ">=3.12"
dependencies = [
    "alerting-contracts",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "redis>=5",
    "asyncpg",
    "prometheus-client",
    # config/watcher.py imports watchfiles at runtime.
    "watchfiles",
    "orjson",
    # llm/client.py imports httpx at runtime.
    "httpx",
]

[tool.uv.sources]
alerting-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alerting_core"]
